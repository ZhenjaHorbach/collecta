  <g stroke="#FFFFFF" stroke-width="80" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 220 380 L 220 220 L 380 220"/>
    <path d="M 644 220 L 804 220 L 804 380"/>
    <path d="M 804 644 L 804 804 L 644 804"/>
    <path d="M 380 804 L 220 804 L 220 644"/>
  </g>
  <circle cx="512" cy="512" r="80" fill="#FFFFFF"/>
</svg>
