name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — fine for CI checks. Never set
# this on deploy-supabase.yml; in-flight migrations must complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prettier check
        run: npm run format:check
      - name: ESLint
        run: npx eslint . --max-warnings 0
      - name: TypeScript strict check
        run: npx tsc --noEmit
      - name: React Compiler healthcheck
        run: npm run react-compiler:check

  test:
    name: Jest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run tests
        run: npm test -- --ci --coverage --passWithNoTests

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor || true

  deploy:
    name: Deploy to EAS Hosting
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install EAS CLI
        run: npm install -g eas-cli
      # Pull EXPO_PUBLIC_* and other build-time env from EAS Env so EAS
      # is the single source of truth. New public vars added via
      # `eas env:create production` reach the next deploy with no
      # workflow change. Requires EXPO_TOKEN with env:read scope.
      - name: Pull environment from EAS
        run: eas env:pull --environment production --path .env.local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Export web build
        run: npx expo export --platform web
      - name: Post-build checks
        run: bash scripts/post-build-checks.sh
      - name: Deploy to EAS Hosting (production alias)
        # --production promotes this deployment to the stable
        # https://collecta.expo.app alias. EAS still keeps the
        # deployment-specific hashed URL for history / rollback.
        run: eas deploy --production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
