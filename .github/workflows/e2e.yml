name: E2E (Maestro)

# Runs the Maestro flow suite on an Android emulator. Manual + weekly
# canary — surfaces UI regressions that lint/typecheck/Jest can't catch
# (broken navigation, removed testIDs, sign-in regression).
#
# Cost: ~15-20 min/run. Weekly cron + manual = ~80 min/month, well
# inside the 2000-min Linux free tier on private repos.
#
# CI runs Android-only — iOS would 10× the macOS minute cost without
# adding signal (testIDs are platform-agnostic).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

# Don't queue concurrent runs — emulator boot is heavy and the seeded
# Supabase test user is shared.
concurrency:
  group: e2e-android
  cancel-in-progress: false

jobs:
  android:
    name: Run Maestro flows on Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM
        # AVD perf collapses without /dev/kvm — reactivecircus/android-emulator-runner
        # documents this as a required step on ubuntu-latest.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro CLI
        # Pin the version so a Maestro release in between runs doesn't
        # silently break the wrapper (which extracts driver APKs from
        # `maestro-client*.jar`). Bump deliberately; verify locally first.
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash -s -- --version 2.5.1
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Cache Gradle
        # Gradle dep resolution + transformed AARs dominate the EAS build
        # cold-start (~5-10 min). Key on files that affect the native
        # dependency graph: package-lock (RN libs) + app.json/app.config.ts
        # (plugins → autolinking output). android/ itself is gitignored
        # (CNG regenerates it via `expo prebuild`), so we don't cache that.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'app.json', 'app.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Seed Supabase test user
        # Provisions test@collecta.app + the seeded collection. Idempotent.
        # Reuses EXPO_PUBLIC_SUPABASE_URL (also baked into the EAS build
        # below) so we don't maintain two secrets with the same value.
        run: npm run test:e2e:seed
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXPO_PUBLIC_TEST_EMAIL: ${{ secrets.EXPO_PUBLIC_TEST_EMAIL }}
          EXPO_PUBLIC_TEST_PASSWORD: ${{ secrets.EXPO_PUBLIC_TEST_PASSWORD }}

      - name: EAS local Android preview build
        # Produces an installable APK with EXPO_PUBLIC_* baked in. Metro
        # is not running in CI, so the bundle has to be pre-built.
        # `preview` profile = production-like APK, no expo-dev-client
        # dependency. See eas.json.
        run: npx eas-cli build --local --platform android --profile preview --non-interactive --output build/app.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_POWERSYNC_URL: ${{ secrets.EXPO_PUBLIC_POWERSYNC_URL }}
          EXPO_PUBLIC_TEST_EMAIL: ${{ secrets.EXPO_PUBLIC_TEST_EMAIL }}
          EXPO_PUBLIC_TEST_PASSWORD: ${{ secrets.EXPO_PUBLIC_TEST_PASSWORD }}

      - name: Run Maestro flows on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot -no-boot-anim -camera-back virtualscene -no-window -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install build/app.apk
            bash maestro/run.sh maestro/flows/ --debug-output debug

      - name: Upload Maestro debug artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: maestro-debug-${{ github.run_number }}
          path: debug/
          retention-days: 30
