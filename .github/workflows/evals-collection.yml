name: Collection generator evals

# Structural evals catch prompt / pipeline regressions in the weekly
# collection generator (wrong category, dup vs catalog, non-English ai_hints,
# duplicate item names, rarity bias). The full multi-agent pipeline (topic
# picker + coordinator + 4 subagents = ~6 Claude calls) is run ONCE per CI
# invocation; every assertion below re-uses that one memoised run.
#
# Paths filter: only run when the script, the prompt, or one of the agents
# changes — random PRs in unrelated areas wouldn't affect generator output.
#
# Calibration (8–20 full pipeline runs + self-grade, ~$0.6–1.6) is
# workflow_dispatch-only.

on:
  pull_request:
    paths:
      - 'scripts/generate-collection.ts'
      - 'scripts/generate-collection.sh'
      - 'scripts/generate-collection.prompt.md'
      - 'src/agents/**'
      - 'src/evals/collection-generator.eval.ts'
      - 'src/evals/collection-calibration.eval.ts'
  workflow_dispatch:
    inputs:
      include_calibration:
        description: 'Also run the calibration suite (8 generations + self-grade)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  structural:
    name: Structural evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Run structural suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: scripts/run-evals.sh --suite collection-generator

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-generator-report-${{ github.run_number }}
          path: eval-results/
          retention-days: 30

  calibration:
    name: Calibration suite
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.include_calibration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Run calibration suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          COLLECTION_CALIBRATION_RUNS: '8'
        run: scripts/run-evals.sh --suite collection-calibration

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-calibration-report-${{ github.run_number }}
          path: eval-results/
          retention-days: 30
